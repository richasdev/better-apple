<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- BetterApple logo, light appearance: gold apple with ^ ^ eyes. Original apple shape, no bite. -->
  <defs>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FCE9A8"/>
      <stop offset="0.38" stop-color="#E8BC52"/>
      <stop offset="0.72" stop-color="#B8862B"/>
      <stop offset="1" stop-color="#7C5715"/>
    </linearGradient>
    <linearGradient id="goldDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A93E"/>
      <stop offset="1" stop-color="#8C6219"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.3" r="0.35">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="appleClip"><path d="M512 382 C 560 338, 650 324, 706 366 C 772 416, 790 506, 772 596 C 752 696, 690 792, 620 802 C 580 808, 552 788, 512 788 C 472 788, 444 808, 404 802 C 334 792, 272 696, 252 596 C 234 506, 252 416, 318 366 C 374 324, 464 338, 512 382 Z"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#FFFFFF"/>
  <g filter="url(#shadow)">
    <path d="M512 380 C 520 330, 528 296, 548 262" fill="none" stroke="url(#goldDeep)" stroke-width="24" stroke-linecap="round"/>
    <path d="M552 300 C 566 246, 616 220, 676 228 C 662 288, 612 316, 552 300 Z" fill="url(#goldDeep)"/>
    <path d="M512 382 C 560 338, 650 324, 706 366 C 772 416, 790 506, 772 596 C 752 696, 690 792, 620 802 C 580 808, 552 788, 512 788 C 472 788, 444 808, 404 802 C 334 792, 272 696, 252 596 C 234 506, 252 416, 318 366 C 374 324, 464 338, 512 382 Z" fill="url(#gold)"/>
    <ellipse clip-path="url(#appleClip)" cx="400" cy="470" rx="150" ry="130" fill="url(#shine)"/>
  </g>
  <g fill="none" stroke="#3A2808" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="386,602 430,552 474,602"/>
    <polyline points="550,602 594,552 638,602"/>
